# Note: FGAC_Query_Test is intentionally NOT defined as a job. It must be run
# interactively by attaching to the FGAC-ML-Runtime-Test cluster, because the demo
# shows how DIFFERENT users see different data based on group membership. A job would
# always run as a single identity and could not demonstrate that difference.
resources:
  jobs:
    fgac_setup:
      name: FGAC_Setup
      description: >-
        Creates the rls_demo schema, employees table (Faker data),
        row filter / column mask UDFs, account-level groups, and grants.
      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ../FGAC_Setup.py
            base_parameters:
              catalog_name: ${var.catalog_name}
          existing_cluster_id: ${resources.clusters.fgac_ml_cluster.id}

    fgac_manage_groups:
      name: Manage_Test_Groups
      description: >-
        Add/remove users from the Upstart_ML_all group
        to demonstrate FGAC access differences.
      tasks:
        - task_key: manage_groups
          notebook_task:
            notebook_path: ../Manage_Test_Groups.py
          existing_cluster_id: ${resources.clusters.fgac_ml_cluster.id}

    fgac_teardown:
      name: FGAC_Teardown
      description: >-
        Removes all FGAC resources: row filter, column masks, UDFs,
        table, schema, and account-level groups.
      tasks:
        - task_key: teardown
          notebook_task:
            notebook_path: ../FGAC_Teardown.py
            base_parameters:
              catalog_name: ${var.catalog_name}
          existing_cluster_id: ${resources.clusters.fgac_ml_cluster.id}
